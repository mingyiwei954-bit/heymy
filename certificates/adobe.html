<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>明艺薇 · Adobe Photoshop 证书</title><link rel="icon" href="../assets/img/evie-ming.svg"><style>
*{box-sizing:border-box}body{margin:0;background:#f2f3f5;color:#292b30;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}header{height:72px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;gap:24px}h1{font-size:17px;font-weight:600;margin:0}nav{display:flex;gap:12px;align-items:center}a,button{font:inherit;font-size:14px;color:inherit;border:0;background:white;padding:10px 16px;border-radius:999px;text-decoration:none;cursor:pointer}main{height:calc(100vh - 72px);padding:12px 32px 28px;display:flex;align-items:center;justify-content:center;overflow:auto}img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;box-shadow:0 8px 35px #0000000d;cursor:zoom-in;user-select:none;-webkit-user-drag:none}main.zoomed{display:block}main.zoomed img{max-width:none;max-height:none;width:2800px;height:auto;cursor:zoom-out}a:focus-visible,button:focus-visible,img:focus-visible{outline:2px solid #5577ca;outline-offset:4px}
</style></head><body><header><h1>明艺薇 · Adobe Photoshop 国际认证证书</h1><nav><button id="zoom" type="button" aria-pressed="false">放大查看</button><a href="../#certificates">返回主页</a></nav></header><main id="viewer"><img src="adobe-certificate.png" alt="明艺薇 Adobe Certified Professional：Visual Design Using Adobe Photoshop 完整证书" draggable="false" tabindex="0" role="button" aria-label="切换证书放大显示"></main><script>
const viewer=document.querySelector('#viewer'),zoom=document.querySelector('#zoom'),image=viewer.querySelector('img');function toggle(){const enlarged=viewer.classList.toggle('zoomed');zoom.textContent=enlarged?'适应窗口':'放大查看';zoom.setAttribute('aria-pressed',String(enlarged));}zoom.addEventListener('click',toggle);image.addEventListener('click',toggle);image.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}});
</script></body></html>
